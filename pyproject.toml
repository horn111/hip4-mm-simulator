[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "hip4-mm-simulator"
version = "0.2.0"
description = "Experimental, volume-conserving execution simulator for Hyperliquid HIP-4 market makers."
authors = ["horn111"]
license = "MIT"
readme = "README.md"
packages = [{include = "hl_paper_trading", from = "src"}]
keywords = ["hyperliquid", "paper-trading", "market-making", "outcomes", "HIP-4", "quantitative-finance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Topic :: Office/Business :: Financial :: Investment",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
pydantic = ">=2.0,<3.0"
structlog = ">=24.0"
websockets = {version = ">=12.0", optional = true}
aiohttp = {version = ">=3.9", optional = true}

[tool.poetry.extras]
live = ["websockets", "aiohttp"]

[tool.poetry.scripts]
hip4-sim = "hl_paper_trading.cli:main"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
pytest-cov = ">=5.0"
ruff = ">=0.4"
mypy = ">=1.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short --strict-markers --cov=hl_paper_trading --cov-report=term-missing --cov-fail-under=85"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "N", "S", "B", "A", "C4", "SIM", "TCH"]
ignore = [
    "S101",  # assert is fine in tests
    "S107",  # quote_token defaults are asset symbols, not passwords
    "TC001",
    "TC003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S106"]  # quote_token fixtures are not credentials

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
