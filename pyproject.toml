[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "hl-paper-trading"
version = "0.1.0"
description = "Paper trading framework for Hyperliquid HIP-4 outcome markets (0.0–1.0). Pessimistic execution engine for market-maker strategy development."
authors = ["horn111"]
license = "MIT"
readme = "README.md"
packages = [{include = "hl_paper_trading", from = "src"}]
keywords = ["hyperliquid", "paper-trading", "market-making", "outcomes", "HIP-4", "quantitative-finance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Topic :: Office/Business :: Financial :: Investment",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
pydantic = ">=2.0,<3.0"
structlog = ">=24.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
pytest-asyncio = ">=0.23"
pytest-cov = ">=5.0"
ruff = ">=0.4"
mypy = ">=1.10"

[tool.poetry.group.live.dependencies]
websockets = ">=12.0"
aiohttp = ">=3.9"
hyperliquid-python-sdk = ">=0.8"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short --strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "N", "S", "B", "A", "C4", "SIM", "TCH"]
ignore = ["S101"]  # assert is fine in tests

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
